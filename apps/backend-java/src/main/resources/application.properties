spring.application.name=appointment-booking

#spring.application.name=outpatient-appointment-system

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/opd_db
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=yourSuperSecureSecretKeyForJwtTokenGeneration123456
app.jwt.access-token-expiration=86400000
app.jwt.refresh-token-expiration=604800000